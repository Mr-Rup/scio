[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "omnistats"
dynamic = ["version"]
description = "Autonomous Statistical Inference Engine, One-Tap EDA, and Universal Scientific Modeling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Mr-Rup", email = "majumdarb107@gmail.com" }
]
keywords = [
    "statistics",
    "hypothesis-testing",
    "eda",
    "data-analysis",
    "pandas",
    "scipy",
    "p-values",
    "effect-sizes",
    "econometrics",
    "biostatistics",
    "causal-inference",
    "survival-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Mr-Rup/scio"
Documentation = "https://mr-rup.github.io/scio/"
Repository = "https://github.com/Mr-Rup/scio.git"
Issues = "https://github.com/Mr-Rup/scio/issues"
Changelog = "https://github.com/Mr-Rup/scio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8.0",
]
polars = [
    "polars>=0.20.0",
    "narwhals>=1.0.0",
]
all = [
    "matplotlib>=3.8.0",
    "polars>=0.20.0",
    "narwhals>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pandas-stubs>=2.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
]
lint = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pandas-stubs>=2.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[project.scripts]
omnistats = "omnistats.cli.app:main"
pyscio = "omnistats.cli.app:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.4.0"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/framework_specs",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["omnistats", "pyscio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "rich.*", "matplotlib.*", "polars.*", "narwhals.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "parity: R 4.3 golden reference numerical parity benchmarks",
    "property: Hypothesis property-based fuzz tests",
]

[tool.coverage.run]
source = ["omnistats"]
branch = true
omit = ["omnistats/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
